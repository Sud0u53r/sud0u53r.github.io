baseURL = "https://Sud0u53r.github.io/"
title = "Akash Gurugunti"
theme = "hugo-theme-bootstrap"
copyright = "Copyright © 2018-{year} Akash Gurugunti. All Rights Reserved."

# Multilingual mode
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true # If you use only one language comment this option

# Pagination
paginate = 5
# paginatePath = "page"

# Google analytics
# googleAnalytics = "UA-123-45"

enableRobotsTXT = true
enableEmoji = true

# hasCJKLanguage = true # Turn on it if your content contains Chinese/Japanese/Korean Languages.

pygmentsUseClasses = true

[blackfriday]
  hrefTargetBlank = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"